name: CI ♻️
on:
  push:
    branches:
      - master
  pull_request:
    branches-ignore:
      - release
jobs:
  supported-jdk:
    name: Build 🏗️ ${{ matrix.title }}
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: JDK 11
            java: 11
          - title: JDK 18
            java: 18
          - title: JDK 21
            java: 21
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository 📥
        uses: actions/checkout@v3
      - name: Setup JDK ${{ matrix.java }} ☕️
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Java version ☕️
        run: java -version
      - name: Setup Maven Cache 💾
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Test 📊
        run: ./mvnw -B install # install rather than verify to ensure correct version used during integration test
  sanity:
    name: Sanity 🦢️
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository 📥
        uses: actions/checkout@v3
      - name: Setup JDK ${{ matrix.java }} ☕️
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Java version ☕️
        run: java -version
      - name: Setup Maven Cache 💾
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Spotless ✨
        run: ./mvnw spotless:check # plugin:3.1.0:check failed: Unable to load the mojo 'check' in the plugin 'com.diffplug.spotless:spotless-maven-plugin:3.1.0' due to an API incompatibility:
      - name: Rewrite ⚙️
        run: ./mvnw rewrite:dryRun
